<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GölgeFilo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#060B16;--sf:#0F172A;--el:#18233C;--br:#2563EB;--cy:#38BDF8;--ok:#10B981;--wn:#F59E0B;--dg:#EF4444;--tx:#E8F1FF;--mu:#8CA0BF;--bd:rgba(56,189,248,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
html,body{height:100%;background:#03060d;color:var(--tx)}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;background:radial-gradient(circle at 80% -10%,#0f2347 0,var(--bg) 55%);overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:14px 16px 90px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#2f6df0,#1D63ED);color:#fff;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:15px;box-shadow:0 6px 22px rgba(37,99,235,.45);cursor:pointer;margin:6px 0}
.btn.s{background:var(--el);box-shadow:none;border:1px solid var(--bd);font-weight:700;font-size:13px;padding:12px}
.btn.ok{background:var(--ok);box-shadow:none}
h1{font-size:22px;font-weight:800}h2{font-size:15px;font-weight:800;margin:6px 0 10px}
.mu{color:var(--mu);font-size:12px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;background:var(--el);border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--mu);cursor:pointer}
.chip.on{background:var(--br);color:#fff;border-color:var(--cy)}
.badge{display:inline-block;padding:6px 12px;border-radius:10px;font-size:11px;font-weight:800}
.b-ok{background:rgba(16,185,129,.15);color:var(--ok);border:1px solid var(--ok)}
.b-dg{background:rgba(239,68,68,.15);color:var(--dg);border:1px solid var(--dg)}
.b-wn{background:rgba(245,158,11,.15);color:var(--wn);border:1px solid var(--wn)}
input,select{width:100%;background:var(--el);border:1px solid var(--bd);border-radius:14px;padding:13px;color:var(--tx);font-size:14px;margin:5px 0 8px;outline:0}
input:focus,select:focus{border-color:var(--cy)}
label{font-size:12px;color:var(--mu);font-weight:600}
.tabs{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(10,17,32,.96);border-top:1px solid var(--bd);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;text-align:center;font-size:10.5px;color:var(--mu);cursor:pointer;padding:4px;font-weight:600}
.tab.on{color:var(--cy)}.tab svg{display:block;margin:0 auto 3px}
.tabsw{display:flex;background:var(--el);border-radius:14px;padding:4px;margin-bottom:12px}
.tabsw div{flex:1;text-align:center;padding:10px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mu)}
.tabsw .on{background:var(--br);color:#fff}
.role{border:1.5px solid var(--bd);background:var(--sf);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}
.role.on{border-color:var(--cy);background:var(--el);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.grad{background:linear-gradient(135deg,#2563EB,#7C3AED);border:0}
.num{font-variant-numeric:tabular-nums;font-weight:800}
.sheet{position:absolute;inset:0;background:rgba(2,6,14,.7);z-index:10;display:flex;align-items:flex-end}
.sheet>div{width:100%;max-height:92%;overflow:auto;background:var(--sf);border-radius:24px 24px 0 0;border:1px solid var(--bd);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.hs>*{flex:none}
.step{flex:1;text-align:center;font-size:10px;color:var(--mu);font-weight:600}
.step i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 4px;background:var(--el);line-height:26px;font-style:normal;font-size:12px}
.step.on i{background:var(--cy);color:#04101f}.step.on{color:var(--tx)}
.toast{position:absolute;top:14px;left:16px;right:16px;background:var(--ok);color:#03160f;font-weight:700;padding:12px;border-radius:14px;z-index:20;font-size:13px}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--el);border-top-color:var(--cy);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.pin{cursor:pointer}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const I={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',truck:'<path d="M2 6h12v10H2zM14 9h4l4 4v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',wallet:'<path d="M3 7h17v13H3z"/><path d="M3 7l12-4v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/>',file:'<path d="M6 2h9l4 4v16H6z"/><path d="M9 12h7M9 16h7"/>',pin:'<path d="M12 22s7-7 7-12a7 7 0 10-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',leaf:'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l8-8"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'};
const ic=(n,s=22,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const logo=(s=40,t=1)=>`<span class="row" style="gap:8px"><svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" stroke="#38BDF8" stroke-width="2.4"><circle cx="24" cy="24" r="19"/><circle cx="24" cy="24" r="6"/><path d="M24 5v13M24 30v13M7 33l11-6M41 33l-11-6M7 15l11 6M41 15l-11 6" opacity=".7"/></svg>${t?`<b style="font-size:${s*.55}px;letter-spacing:.5px;color:#EAF6FF">GÖLGE<span style="color:#3B82F6">FİLO</span></b>`:''}</span>`;
const TL=n=>'₺'+n.toLocaleString('tr-TR');
const plans=[{id:'bas',n:'Başlangıç',p:0,c:12,f:['Ayda en fazla 3 aktif yük ilanı','Standart GPS canlı takip','Temel kasa/kapı uyum kontrolü']},{id:'pro',n:'Pro Filo',p:1490,c:6,pop:1,f:['Sınırsız hızlı yük ve şablon','Öncelikli boş dönüş radarı','Paylaşımlı / kısmi kapasite','Mikro-kargo sigortası indirimi','Aylık kurumsal ESG raporu']},{id:'kur',n:'Kurumsal Lojistik',p:4290,c:3,f:['₺2.500 hoş geldin bakiye kredisi','Çoklu şube ve alt kullanıcı','API / ERP ve e-İrsaliye entegrasyonu','7/24 öncelikli operasyon temsilcisi','SKA 9 ve SKA 13 ESG sertifikası']}];
const loads=[{id:1,from:'Tuzla',to:'Sincan',w:'1.200 kg',pal:'120×120 cm Palet',km:452,dk:300,pr:4300,fit:1,x:62,y:62,co:'Beta Lojistik'},{id:2,from:'Gebze',to:'Etimesgut',w:'5.800 kg',pal:'Rulo 140×140 cm',km:430,dk:285,pr:12500,fit:1,x:48,y:44,co:'Yıldız Metal'},{id:3,from:'Pendik',to:'Ostim',w:'900 kg',pal:'Makine 280×150 cm',km:440,dk:290,pr:5200,fit:0,x:30,y:70,co:'Demir Makine'}];
const tpls=[{c:'İstanbul',t:'Palet (1.200 kg)',p:4300,d:'90 dk',co:'18 kg CO₂'},{c:'Ankara',t:'Rulo (5.800 kg)',p:12500,d:'4 sa 45 dk',co:'42 kg CO₂'},{c:'İzmir',t:'Koli (640 kg)',p:3900,d:'3 sa 10 dk',co:'27 kg CO₂'}];
const promos=['Akaryakıtta %7 indirim','HGS avantajı: %10 geçiş iadesi','Esnaf lokantası menüsü ₺120','Lastik ve bakım %15 indirim'];
const bpromos=['İlk gönderimde %20 indirim','Ücretsiz mikro-kargo sigortası','Kurumsal ESG raporu avantajı'];
const vehs={tir:{n:'Tır (13.60 Dorse)',L:1360,W:245,H:260},kam:{n:'Kamyon (10 Teker)',L:750,W:240,H:250},kmt:{n:'Kamyonet (Panelvan)',L:450,W:200,H:190}};
const S={scr:'splash',role:null,tab:0,auth:'in',plan:'pro',sub:3,sim:{v:'tir',pw:120,pl:120,n:8},filt:'Uygun Yükler',sel:null,step:1,free:false,home:false,ret:{cap:'Tam Kasa',ilce:'Ankara (Sincan)',cik:'1 Saat İçinde'},off:'Bekleyen',offers:[{id:101,l:2,pr:11800,st:'Bekleyen'},{id:102,l:1,pr:4100,st:'Kabul Edilen'}],bo:[{id:1,n:'Kuzey Nakliyat • Palet 1.200 kg',pr:4100,fit:1,plate:'34 *** 1923'},{id:2,n:'Anadolu Taşıma • Rulo 5.800 kg',pr:11800,fit:1,plate:'06 *** 4471'},{id:3,n:'Ege Frigo • Makine 2.800 mm',pr:5000,fit:0,plate:'35 *** 2208'}],bal:128450,priv:'İlçe düzeyi',modal:null,toast:null,tpl:[]};
const car=document.createElement('canvas');
function toast(t){S.toast=t;draw();setTimeout(()=>{S.toast=null;draw()},2200)}
function map(h,{route=1,pins=[],trucks=[],done=0}={}){let p='';
 pins.forEach(l=>p+=`<g class="pin" data-a="pick" data-v="${l.id}"><circle cx="${l.x}%" cy="${l.y}%" r="15" fill="rgba(56,189,248,.18)"/><circle cx="${l.x}%" cy="${l.y}%" r="8" fill="${l.fit?'#10B981':'#EF4444'}" stroke="#fff" stroke-width="2"/></g>`);
 trucks.forEach(t=>p+=`<g><circle cx="${t[0]}%" cy="${t[1]}%" r="12" fill="rgba(56,189,248,.2)"/><circle cx="${t[0]}%" cy="${t[1]}%" r="6" fill="#38BDF8" stroke="#fff" stroke-width="1.5"/></g>`);
 return `<svg width="100%" height="${h}" style="border-radius:18px;background:#09111f;border:1px solid var(--bd);display:block" viewBox="0 0 300 ${h}" preserveAspectRatio="none"><defs><pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#12203a" stroke-width="1"/></pattern></defs><rect width="300" height="${h}" fill="url(#g)"/><path d="M0 ${h*.6}Q80 ${h*.4} 150 ${h*.55}T300 ${h*.35}" stroke="#0e2a4a" stroke-width="16" fill="none"/><path d="M20 ${h*.2}L120 ${h*.35}L210 ${h*.25}L290 ${h*.6}M60 ${h}L130 ${h*.5}L250 ${h*.1}" stroke="#16294a" stroke-width="2" fill="none"/>${route?`<path d="M45 ${h*.3}Q120 ${h*.55} 170 ${h*.45}T255 ${h*.72}" stroke="#38BDF8" stroke-width="3.5" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 5px #38BDF8)"/><circle cx="45" cy="${h*.3}" r="7" fill="#2563EB" stroke="#fff" stroke-width="2"/><circle cx="255" cy="${h*.72}" r="7" fill="${done?'#10B981':'#F97316'}" stroke="#fff" stroke-width="2"/>`:''}</svg>`.replace(/(cx|cy)="([\d.]+)%"/g,(m,a,v)=>`${a}="${a=='cx'?v*3:v*h/100}"`)}
function head(){const b=S.role=='business';return `<div class="row sp" style="padding:12px 16px 0">${logo(32)}<div class="row"><span class="badge b-ok" style="font-size:10px">${b?'Pro Filo':'Tır / Kamyonet Şoförü'}</span><span data-a="priv" style="cursor:pointer;color:var(--cy)">${ic('gear',22)}</span></div></div>`}
function tabs(arr){return `<div class="tabs">${arr.map((t,i)=>`<div class="tab ${S.tab==i?'on':''}" data-a="tab" data-v="${i}">${ic(t[1])}${t[0]}</div>`).join('')}</div>`}
function splash(){return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px">${logo(80)}<div class="spin"></div><div class="mu">GölgeFilo Ağı Başlatılıyor...</div></div>`}
function auth(){const d=S.role=='driver',b=S.role=='business';let f='';
 if(S.auth=='up'){f=`<label>Ad Soyad</label><input placeholder="Adınız ve soyadınız"><label>Cep Telefonu</label><input value="+90 " inputmode="tel"><label>E-posta</label><input type="email" placeholder="ornek@sirket.com"><label>Şifre</label><input type="password">`+(b?`<label>Şirket Ünvanı</label><input><label>Vergi Numarası / Vergi Dairesi</label><input><label>Faaliyet Sektörü</label><select><option>Toptan Ticaret</option><option>Üretim</option><option>E-ticaret</option><option>Beyaz Eşya</option></select>`:d?`<label>Araç Tipi</label><select>${Object.values(vehs).map(v=>`<option>${v.n}</option>`).join('')}<option>Frigorifik</option></select><label>Araç Plakası</label><input placeholder="34 ABC 123"><label>Kasa İç Ölçüleri (En × Boy × Yükseklik, cm)</label><input placeholder="240 × 600 × 240"><label>Azami Taşıma Kapasitesi (kg)</label><input inputmode="numeric">`:'')+`<label class="row" style="margin:6px 0"><input type="checkbox" style="width:auto;margin:0"> KVKK ve Gizlilik Aydınlatma Metni’ni okudum, onaylıyorum</label>`}
 else f=`<label>E-posta veya Telefon</label><input placeholder="ornek@sirket.com"><label>Şifre</label><input type="password"><div class="row sp mu"><label class="row"><input type="checkbox" style="width:auto;margin:0" checked> Beni Hatırla</label><span style="color:var(--cy)">Şifremi Unuttum</span></div>`;
 return `<div class="scr" style="padding-bottom:30px"><div style="margin:8px 0 16px">${logo(44)}</div>
 <div class="role ${b?'on':''}" data-a="role" data-v="business"><b>İşletme / Sevkiyatçı</b><div class="mu">Yük gönder, boş dönüş araçlarıyla %60 tasarruf et</div></div>
 <div class="role ${d?'on':''}" data-a="role" data-v="driver"><b>Tır &amp; Ticari Araç Şoförü</b><div class="mu">Boş dönüş rotanı paraya çevir, anında yük bul</div></div>
 <div class="tabsw"><div class="${S.auth=='in'?'on':''}" data-a="au" data-v="in">Giriş Yap</div><div class="${S.auth=='up'?'on':''}" data-a="au" data-v="up">Üye Ol</div></div>
 ${S.role?`<h2>${S.auth=='in'?'Giriş Yap':'Üye Ol'} • ${b?'İşletme':'Şoför'}</h2>${f}<button class="btn" data-a="login">${S.auth=='in'?'Giriş Yap':'Kaydı Tamamla'}</button>`:'<div class="mu" style="text-align:center;margin:10px">Devam etmek için bir rol seçin.</div>'}
 <button class="btn s" data-a="demo" data-v="business">Demo İşletme ile Gir</button><button class="btn s" data-a="demo" data-v="driver">Demo Şoför ile Gir</button></div>`}
function sav(){const p=plans.find(x=>x.id==S.plan);return Math.max(0,Math.round(S.sub*2900*0.6*(1-p.c/100)-p.p))}
function subs(){const sv=sav();
 return `<div class="scr" style="padding-bottom:30px"><div style="margin:8px 0">${logo(32)}</div><h1>İşletme Üyelik Paketleri</h1><p class="mu" style="margin:6px 0 14px">Bir boş dönüş sevkiyatı ortalama ₺1.800 – ₺4.500 navlun tasarrufu sağlar.</p>
 ${plans.map(x=>`<div class="role ${S.plan==x.id?'on':''}" data-a="plan" data-v="${x.id}"><div class="row sp"><b>${x.n}</b>${x.pop?'<span class="badge b-ok">En Popüler</span>':''}</div><div class="num" style="font-size:22px;margin:4px 0">${TL(x.p)} <span class="mu">/ Ay</span></div><div class="mu" style="margin-bottom:6px">İşlem komisyonu %${x.c}${x.p?'':' • kullandıkça öde'}</div>${x.f.map(t=>`<div style="font-size:12.5px;margin:3px 0"><span style="color:var(--ok)">✓</span> ${t}</div>`).join('')}</div>`).join('')}
 <div class="card"><h2>Tasarruf Hesaplayıcı</h2><div class="row sp mu"><span>Aylık sevkiyat sayısı</span><b class="num" id="s1" style="color:var(--tx)">${S.sub}</b></div><input type="range" min="1" max="40" value="${S.sub}" data-a="sub" style="padding:0"><div class="mu">Tahmini aylık net tasarruf</div><div class="num" id="s2" style="font-size:26px;color:var(--ok)">${TL(sv)}</div></div>
 <button class="btn" data-a="goBiz">Paketi Seç ve Panele Geç →</button></div>`}
function promo(a){return `<h2>Fırsatlar</h2><div class="hs">${a.map(t=>`<div class="card grad" style="width:200px;margin:0;font-weight:700;font-size:13px">${t}</div>`).join('')}</div>`}
function sheetLoad(){const l=loads.find(x=>x.id==S.sel);if(!l)return'';return `<div class="sheet" data-a="closeSel"><div data-stop><div class="row sp"><h1 style="font-size:18px">${l.from} → ${l.to}</h1><span class="num" style="color:var(--ok)">${TL(l.pr)}</span></div><div class="mu" style="margin:6px 0 10px">${l.km} km • ${Math.floor(l.dk/60)} sa ${l.dk%60} dk • ${l.w} • ${l.pal}</div><span class="badge ${l.fit?'b-ok':'b-dg'}">${l.fit?'✓ KASA KAPISINA UYUMLU':'✕ KASA / KAPI ÖLÇÜSÜNE SIĞMIYOR'}</span><button class="btn" data-a="offer" data-v="${l.id}" style="margin-top:14px">Fiyat Teklifi Ver</button></div></div>`}
function drvHome(){const F=['Uygun Yükler','Rota Uyumu','Kasa/Kapı Uyumu','Ücretli Geçiş Yok','Çoklu Durak','Mola & Esnaf Noktaları'];let pl=loads;if(S.filt=='Kasa/Kapı Uyumu'||S.filt=='Uygun Yükler')pl=loads.filter(l=>l.fit||S.filt=='Uygun Yükler'&&false);if(S.filt=='Uygun Yükler')pl=loads.filter(l=>l.fit);
 return `${head()}<div class="scr">
 <button class="btn" data-a="ret" style="font-size:17px;padding:18px">${ic('truck',24)} Boşum, Dönüyorum</button>
 <div class="card row sp"><div><b>${S.home?S.ret.cap+' • '+S.ret.ilce:'Boş dönüş kapasitesi pasif'}</b><div class="mu">${S.home?'Konum paylaşımı: '+S.priv+' (bulanık)':'Güzergah bildirerek yük eşleşmesini başlat'}</div></div><button class="btn s" style="width:auto;color:var(--dg)" data-a="sos">SOS</button></div>
 <div class="card b-wn" style="font-size:12.5px"><b>Yasaklı Saat &amp; Tonaj Kalkanı</b><br>Büyükşehir tır/kamyon yasağı: 06:00–10:00 ve 16:00–22:00. Köprü/tünel geçişinde 5 t üzeri uyarı aktif.</div>
 <div class="chips">${F.map(f=>`<div class="chip ${S.filt==f?'on':''}" data-a="filt" data-v="${f}">${f}</div>`).join('')}</div>
 ${map(260,{pins:S.filt=='Mola & Esnaf Noktaları'?[]:pl,trucks:S.filt=='Mola & Esnaf Noktaları'?[[30,30],[70,60],[50,80]]:[]})}
 <div class="mu" style="margin:8px 2px">${S.filt=='Mola & Esnaf Noktaları'?'Mavi noktalar: mola, yemek ve duş/tuvalet noktaları':'Yük pinine dokunarak ayrıntıları aç'}</div>${promo(promos)}</div>${S.sel?sheetLoad():''}`}
function retSheet(){const r=S.ret,seg=(k,a)=>`<div class="row" style="gap:8px;margin:5px 0 10px">${a.map(x=>`<div class="chip ${r[k]==x?'on':''}" style="flex:1;text-align:center;padding:12px" data-a="rset" data-k="${k}" data-v="${x}">${x}</div>`).join('')}</div>`;
 return `<div class="sheet" data-a="closeM"><div data-stop>${map(130)}<h2 style="margin-top:14px">Boş Dönüş Bildirimi</h2><label>Kapasite</label>${seg('cap',['Yarım Kasa','Tam Kasa'])}<label>Gidiş Yönü / İlçe</label><select data-a="ilce"><option ${r.ilce=='Ankara (Sincan)'?'selected':''}>Ankara (Sincan)</option><option ${r.ilce=='İstanbul (Tuzla)'?'selected':''}>İstanbul (Tuzla)</option><option>İzmir (Bornova)</option></select><label>Tahmini Çıkış</label>${seg('cik',['Hemen','30 Dakika İçinde','1 Saat İçinde'])}<button class="btn" data-a="retGo">Dönüş Yükü Tekliflerini Al</button></div></div>`}
function offerScr(){const l=loads.find(x=>x.id==S.offerId),pr=S.offerPr,net=Math.round(pr*.94-(S.toll?260:0));return `<div class="scr" style="padding-bottom:30px"><div class="row" data-a="back" style="cursor:pointer;color:var(--cy);margin:8px 0">‹ Geri</div><h1>Fiyat Teklifi Ver</h1><div class="card" style="margin-top:12px"><b>${l.co}</b><div class="mu">${l.from} → ${l.to} • ${l.w} • ${l.pal}</div><div style="margin-top:8px"><span class="badge ${l.fit?'b-ok':'b-dg'}">${l.fit?'✓ KASA KAPISINA UYUMLU':'✕ SIĞMIYOR'}</span></div></div>

function iso(n,fit){const u=22,cx=150,cy=30,cols=4,rows=3;let b='';const arr=[];for(let k=0;k<3;k++)for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)arr.push([i,j,k]);arr.slice(0,Math.min(n,36)).forEach(([i,j,k])=>{const x=cx+(i-j)*u*.87,y=cy+(i+j)*u*.5+90-k*u*.8,c=fit?['#34d399','#10B981','#059669']:['#f87171','#EF4444','#b91c1c'];b+=`<polygon points="${x},${y-u*.5} ${x+u*.87},${y} ${x},${y+u*.5} ${x-u*.87},${y}" fill="${c[0]}" stroke="#04101f" stroke-width=".8" transform="translate(0,${-u*.8})"/><polygon points="${x-u*.87},${y} ${x},${y+u*.5} ${x},${y+u*.5+u*.8} ${x-u*.87},${y+u*.8}" fill="${c[1]}" stroke="#04101f" stroke-width=".8" transform="translate(0,${-u*.8})"/><polygon points="${x+u*.87},${y} ${x},${y+u*.5} ${x},${y+u*.5+u*.8} ${x+u*.87},${y+u*.8}" fill="${c[2]}" stroke="#04101f" stroke-width=".8" transform="translate(0,${-u*.8})"/>`});return `<svg viewBox="0 0 300 220" width="100%"><polygon points="${cx},${cy+40} ${cx+130},${cy+105} ${cx},${cy+170} ${cx-130},${cy+105}" fill="rgba(56,189,248,.06)" stroke="#38BDF8" stroke-dasharray="4 3"/>${b}</svg>`}
function simSheet(){const s=S.sim,v=vehs[s.v],fit=s.pw<=v.W&&s.pl<=v.W&&s.pw<=v.H,per=Math.floor(v.W/Math.max(s.pw,1))*Math.floor(v.L/Math.max(s.pl,1)),cap=Math.max(per*2,1),fill=Math.min(100,Math.round(s.n/cap*100));return `<div class="sheet" data-a="closeM"><div data-stop><div class="row sp"><h2>Araç Uyumluluk Simülasyonu</h2><span data-a="closeM" style="cursor:pointer">✕</span></div>${truckSvg(v)}<div class="row" style="gap:8px"><div style="flex:1"><label>Araç</label><select data-a="sv">${Object.entries(vehs).map(([k,x])=>`<option value="${k}" ${s.v==k?'selected':''}>${x.n}</option>`).join('')}</select></div><div style="flex:1"><label>Palet adedi</label><input type="number" min="1" max="36" value="${s.n}" data-a="sn"></div></div><div class="row" style="gap:8px"><div style="flex:1"><label>Yük eni (cm)</label><input type="number" value="${s.pw}" data-a="spw"></div><div style="flex:1"><label>Yük boyu (cm)</label><input type="number" value="${s.pl}" data-a="spl"></div></div><div class="card" style="text-align:center;margin:8px 0;border-color:${fit?'var(--ok)':'var(--dg)'}"><b style="color:${fit?'var(--ok)':'var(--dg)'}">${fit?'✓ KASA KAPISINA UYUMLU':'✕ KASA / KAPI ÖLÇÜSÜNE SIĞMIYOR'}</b><div class="mu">${s.pw}×${s.pl} cm Yük | Kapı: ${v.W}×${v.H} cm</div></div>${iso(s.n,fit)}<div class="num" style="text-align:center;color:var(--cy)">%${fill} Dolu</div><button class="btn" data-a="simOk">Aracı Onayla &amp; Teklifleri Gör</button></div></div>`}
function bizHome(){return `${head()}<div class="scr"><h1 style="font-size:18px;margin-bottom:10px">İşletme / Sevkiyatçı Paneli</h1><div class="card grad"><div class="row sp"><div><div style="font-size:12px;color:#dbe7ff">Şirket Bakiyesi</div><div class="num" style="font-size:30px">${TL(S.bal)}</div></div><div class="row"><span class="badge" style="background:rgba(255,255,255,.2)" data-a="addbal">Bakiye Yükle</span></div></div></div><button class="btn" data-a="quick">+ Hızlı Yük Oluştur</button><h2>Hızlı Şablon Yükler</h2><div class="hs">${tpls.map((t,i)=>`<div class="card" style="width:190px;margin:0"><b style="font-size:16px">${t.c}</b><div class="mu">${t.t}</div><div class="num" style="font-size:18px;margin:6px 0">${TL(t.p)}</div><div class="mu">${t.d} • ${t.co}</div><button class="btn s" data-a="useTpl" data-v="${i}" style="margin-top:8px">Bu Şablonla Yük Aç</button></div>`).join('')}</div><h2 style="margin-top:12px">Canlı Filo Takibi</h2><div class="chips">${['Yakındaki Boş Dönüşler','Rota Uyumu','Kasa/Kapı Uyumu','Paylaşımlı Kapasite'].map(f=>`<div class="chip ${S.bf==f?'on':''}" data-a="bf" data-v="${f}">${f}</div>`).join('')}</div>${map(220,{trucks:[[30,35],[55,50],[75,70],[40,75]]})}<div style="margin-top:12px">${promo(bpromos)}</div></div>`}

const A={role:v=>S.role=v,au:v=>S.auth=v,login:()=>{if(!S.role)return;go(S.role)},demo:v=>{S.role=v;go(v)},plan:v=>S.plan=v,sub:(v,e)=>{S.sub=+e.target.value},goBiz:()=>{S.scr='app';S.tab=0},tab:v=>{S.tab=+v},filt:v=>S.filt=v,pick:v=>S.sel=+v,closeSel:(v,e)=>{if(!e.target.closest('[data-stop]'))S.sel=null},offer:v=>{S.offerId=+v;S.offerPr=loads.find(x=>x.id==v).pr;S.toll=0;S.sel=null;S.scr='offer'},back:()=>S.scr='app',adj:v=>S.offerPr=Math.max(500,S.offerPr+ +v),toll:()=>S.toll=!S.toll,sendOff:()=>{S.offers.unshift({id:Date.now(),l:S.offerId,pr:S.offerPr,st:'Bekleyen'});S.scr='app';S.tab=1;S.off='Bekleyen';toast('Teklifiniz gönderildi')},offt:v=>S.off=v,ret:()=>S.modal='ret',rset:(v,e)=>{S.ret[e.currentTarget.dataset.k]=v},ilce:(v,e)=>{if(e.type=='change')S.ret.ilce=e.target.value},retGo:()=>{S.home=1;S.modal=null;toast('Boş dönüş bildirildi • Yük eşleşmeleri aranıyor')},closeM:(v,e)=>{if(!e.target.closest('[data-stop]')||e.currentTarget.tagName=='SPAN')S.modal=null},next:()=>S.step=2,code:()=>S.modal='code',codeOk:()=>{if($('#cd').value=='4827'){S.step=3;S.modal=null;S.co+=18;toast('Teslimat kodu onaylandı')}else $('#ce').textContent='Kod hatalı. Alıcıdan 4 haneli kodu tekrar isteyin.'},qr:()=>S.modal='qr',free:()=>{S.step=1;S.tab=0;S.home=1;toast('Dönüş modu aktif • Yeni yükler aranıyor')},msg:v=>toast(v),sos:()=>toast('SOS: Acil aktarma talebi operasyon ekibine iletildi'),quick:()=>toast('Hızlı yük taslağı oluşturuldu'),useTpl:v=>{S.bal-=tpls[v].p;toast(`${tpls[v].c} yükü açıldı • ${TL(tpls[v].p)} escrow’a alındı`)},addbal:()=>{S.bal+=10000;toast('₺10.000 bakiye yüklendi')},bf:v=>S.bf=v,newTpl:()=>{S.tpl.push({c:'Bursa',t:'Palet (800 kg)',p:2600,d:'2 sa',co:'14 kg CO₂'});},share:()=>S.share=!S.share,sim:()=>S.modal='sim',sv:(v,e)=>{S.sim.v=e.target.value},sn:(v,e)=>{S.sim.n=+e.target.value||1},spw:(v,e)=>{S.sim.pw=+e.target.value||1},spl:(v,e)=>{S.sim.pl=+e.target.value||1},simOk:()=>{S.modal=null;toast('Araç onaylandı')},accept:v=>{const o=S.bo.find(x=>x.id==v);S.bal-=o.pr;S.step=1;toast('Teklif onaylandı • Tutar escrow’a kilitlendi')},priv:()=>S.modal='priv',pv:(v,e)=>{S.priv=e.target.value},out:()=>{S.modal=null;S.role=null;S.scr='auth'}};
